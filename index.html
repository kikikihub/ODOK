<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Day, One Knowledge</title>
<style>
:root{--bg:#fff;--fg:#121213;--mut:#787c7e;--line:#d3d6da;--card:#f6f7f8;--ok:#6aaa64;--bad:#c9503c;--btn:#121213;--btnfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121213;--fg:#f4f4f5;--mut:#9a9ca0;--line:#3a3a3c;--card:#1c1c1e;--ok:#538d4e;--bad:#d4604d;--btn:#f4f4f5;--btnfg:#121213}}
:root[data-theme="dark"]{--bg:#121213;--fg:#f4f4f5;--mut:#9a9ca0;--line:#3a3a3c;--card:#1c1c1e;--ok:#538d4e;--bad:#d4604d;--btn:#f4f4f5;--btnfg:#121213}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto;padding:14px 20px;border-bottom:1px solid var(--line)}
header h1{font:700 1.15rem Georgia,"Times New Roman",serif;margin:0;letter-spacing:.2px}
header span{font-size:.85rem;color:var(--mut);min-width:70px}
header a{text-align:right;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:24px 20px 48px}
h2{font:700 1.7rem/1.25 Georgia,serif;margin:0 0 8px}
p{line-height:1.7;font-size:1.05rem;margin:0 0 14px}
.mut{color:var(--mut);font-size:.95rem}
.tag{display:inline-block;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
input{width:100%;box-sizing:border-box;padding:13px 14px;margin:0 0 10px;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-size:1rem}
input:focus{outline:none;border-color:var(--fg)}
button{font:700 1rem system-ui,sans-serif;border:2px solid var(--btn);background:var(--btn);color:var(--btnfg);padding:14px 22px;border-radius:999px;cursor:pointer;width:100%;margin-top:10px}
button:disabled{opacity:.35;cursor:not-allowed}
button.ghost{background:none;color:var(--fg);border-color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
.chip{width:auto;margin:0;padding:11px 18px;background:none;color:var(--fg);border-color:var(--line);font-weight:600}
.chip.on{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.card{background:var(--card);border-radius:10px;padding:20px;margin:18px 0}
.opt{display:block;text-align:left;width:100%;background:none;color:var(--fg);border:2px solid var(--line);border-radius:8px;padding:14px;margin:10px 0;font-weight:500}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.bar{height:4px;background:var(--line);border-radius:2px;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--fg);border-radius:2px}
.sq{display:flex;gap:8px;justify-content:center;margin:20px 0}
.sq b{width:48px;height:48px;border-radius:4px;background:var(--line)}
.sq b.ok{background:var(--ok)}
.stats{display:flex;justify-content:space-around;text-align:center;margin:24px 0}
.stats strong{display:block;font:700 1.8rem Georgia,serif}
.stats small{color:var(--mut);font-size:.8rem}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin:4px 0}
.center{text-align:center}
.cd{font:700 2rem Georgia,serif;letter-spacing:.05em;margin:6px 0 0}
a{color:var(--fg);text-decoration:underline}
</style>
</head>
<body>
<header><span id="hl"></span><h1>One Day, One Knowledge</h1><span id="hr"></span></header>
<main id="app"></main>
<script>
var SUBJ=["History","Science","Psychology","Finance","Space","Technology"];
var L=[
{s:"History",t:"The stone that unlocked Egypt",b:["In 1799, French soldiers near the town of Rashid (Rosetta) in Egypt found a dark slab covered in writing. The Rosetta Stone carries one royal decree written three times: in Egyptian hieroglyphs, in Demotic script, and in ancient Greek.","Scholars could still read Greek, so the Greek text became the key. By comparing the three versions, Jean-François Champollion announced in 1822 that he had cracked the hieroglyphs, reopening 3,000 years of Egyptian history."],q:[["In which year was the Rosetta Stone found?",["1799","1822","1650"],0,"French soldiers found it in 1799."],["Which script could scholars already read?",["Hieroglyphs","Greek","Demotic"],1,"The Greek text gave them the key to the other two."],["Who announced the deciphering of hieroglyphs?",["Napoleon","Howard Carter","Champollion"],2,"Champollion announced his breakthrough in 1822."]]},
{s:"Science",t:"Why is the sky blue?",b:["Sunlight looks white but contains every colour. When it enters the atmosphere, it bumps into gas molecules and scatters in all directions. This is called Rayleigh scattering.","Shorter wavelengths scatter far more than longer ones, so blue light is bounced around the sky while red passes mostly straight through. At sunset the light travels through much more air, most of the blue is scattered away, and the reds and oranges reach your eyes."],q:[["What is the scattering of light by air molecules called?",["Rayleigh scattering","Refraction","Diffraction"],0,"It is named after Lord Rayleigh."],["Which colour scatters the most?",["Red","Green","Blue"],2,"Shorter wavelengths scatter more, and blue is among the shortest we see."],["Why are sunsets red or orange?",["Light passes through more air","The sun gets hotter","Clouds add colour"],0,"A longer path scatters away the blue, leaving reds."]]},
{s:"Psychology",t:"The forgetting curve",b:["In 1885, Hermann Ebbinghaus tested his own memory with nonsense syllables. He found that we forget quickly at first, then more slowly. Without review, a large share of new information fades within days.","The fix is spaced repetition: review something just as you are about to forget it, then wait longer each time. Short reviews spread over days beat one long cramming session."],q:[["Who first described the forgetting curve?",["Freud","Ebbinghaus","Pavlov"],1,"Ebbinghaus published his findings in 1885."],["When is forgetting fastest?",["Right after learning","After a month","It is constant"],0,"The curve drops steeply at first, then flattens."],["What does spaced repetition do?",["Review at growing intervals","Study everything at once","Avoid review"],0,"Each review is spaced further apart than the last."]]},
{s:"Finance",t:"Compound interest",b:["Simple interest pays only on your original amount. Compound interest pays on your original amount plus the interest already earned, so growth builds on itself. 1,000 at 10% a year becomes 1,100 after year one and 1,210 after year two.","A handy shortcut is the Rule of 72: divide 72 by the annual rate to estimate the years needed to double your money. At 8% that is about 9 years. Starting early matters more than starting big."],q:[["Compound interest is paid on...",["Only the original amount","The original plus earned interest","Only the interest"],1,"Earned interest also earns interest."],["1,000 at 10% for two years becomes about...",["1,200","1,210","1,100"],1,"1,000 → 1,100 → 1,210."],["Using the Rule of 72, money doubles at 6% in about...",["12 years","6 years","72 years"],0,"72 ÷ 6 = 12."]]},
{s:"Space",t:"What is a light-year?",b:["A light-year is a distance, not a time. It is how far light travels in one year: roughly 9.46 trillion kilometres. Space is so large that kilometres become unwieldy.","The nearest star beyond our Sun, Proxima Centauri, is about 4.2 light-years away. Even sunlight takes about 8 minutes to reach Earth, so you always see the Sun as it was a few minutes ago."],q:[["A light-year measures...",["Time","Distance","Brightness"],1,"It is the distance light covers in a year."],["Roughly how far is Proxima Centauri?",["4.2 light-years","42 light-years","0.4 light-years"],0,"It is the closest known star beyond the Sun."],["How long does sunlight take to reach Earth?",["8 seconds","8 minutes","8 hours"],1,"About 8 minutes."]]},
{s:"Technology",t:"How sites store your password",b:["A well-built site never stores your actual password. It stores a hash, the output of a one-way function that turns your password into a fixed-length scrambled string. Hashes cannot be reversed easily, so a leaked database does not directly reveal passwords.","Sites also add a random salt before hashing, so two users with the same password get different hashes. This blocks attackers from using giant precomputed tables of common password hashes."],q:[["What does a site ideally store instead of your password?",["A hash","A copy in plain text","Your email"],0,"Only a hash of the password is kept."],["A hash function is...",["Reversible","One-way","Random"],1,"It is designed to be hard to reverse."],["Why add a salt?",["Same passwords get different hashes","Make passwords shorter","Speed up login"],0,"It defeats precomputed hash tables."]]}
];
var mem={users:{},session:null},v="auth",mode="signup",err="",sel=[],q={i:0,res:[],sel:null};
function load(){try{var s=localStorage.getItem("odok");if(s)mem=JSON.parse(s)}catch(e){}}
function save(){try{localStorage.setItem("odok",JSON.stringify(mem))}catch(e){}}
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayNum(){return Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5)}
function U(){return mem.users[mem.session]}
function lesson(){var u=U(),s=SUBJ.filter(function(x){return u.subjects.indexOf(x)>-1});var n=s[dayNum()%s.length];return L.filter(function(l){return l.s===n})[0]}
function total(u){var t=0;for(var k in u.att)t+=u.att[k].score;return t}
function streak(u){var d=new Date(),n=0;if(!u.att[fmt(d)])d.setDate(d.getDate()-1);while(u.att[fmt(d)]){n++;d.setDate(d.getDate()-1)}return n}
function cd(){var n=new Date(),m=new Date(n);m.setHours(24,0,0,0);var s=Math.floor((m-n)/1e3);return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(function(x){return String(x).padStart(2,"0")}).join(":")}
function go(x){v=x;err="";render()}
function setMode(m){mode=m;err="";render()}
function auth(){
 var e=document.getElementById("em").value.trim().toLowerCase(),p=document.getElementById("pw").value,n=mode==="signup"?document.getElementById("nm").value.trim():"";
 if(mode==="signup"&&!n)return fail("Please enter your name.");
 if(!/^\S+@\S+\.\S+$/.test(e))return fail("Enter a valid email.");
 if(p.length<6)return fail("Password needs at least 6 characters.");
 if(mode==="signup"){if(mem.users[e])return fail("That email is already registered.");mem.users[e]={name:n,pw:p,subjects:[],att:{}};mem.session=e;save();sel=[];go("pick")}
 else{var u=mem.users[e];if(!u||u.pw!==p)return fail("Wrong email or password.");mem.session=e;save();sel=u.subjects.slice();go(u.subjects.length?"home":"pick")}
}
function fail(m){err=m;render()}
function logout(){mem.session=null;save();mode="login";go("auth")}
function tog(s){var i=sel.indexOf(s);if(i>-1)sel.splice(i,1);else if(sel.length<5)sel.push(s);else{err="Pick at most 5 subjects.";render();return}err="";render()}
function savePick(){U().subjects=sel.slice();save();go("home")}
function start(){q={i:0,res:[],sel:null};go("read")}
function pickOpt(j){if(q.sel!==null)return;var l=lesson();q.sel=j;q.res.push(j===l.q[q.i][2]?1:0);render()}
function next(){if(q.i<2){q.i++;q.sel=null;render();return}
 var sc=q.res.reduce(function(a,b){return a+b},0);U().att[fmt(new Date())]={s:lesson().s,res:q.res,score:sc};save();go("home")}
function render(){
 var a=document.getElementById("app"),u=mem.session?U():null,h="";
 document.getElementById("hl").textContent=u?"🔥 "+streak(u):"";
 document.getElementById("hr").innerHTML=u?"<a onclick=\"logout()\">Log out</a>":"";
 document.getElementById("hr").className=u?"mut":"";
 if(v==="auth"){
  h="<h2>"+(mode==="signup"?"Learn one thing a day.":"Welcome back.")+"</h2><p class=\"mut\">One lesson, one short quiz, then you’re done. No endless scroll.</p><div style=\"height:12px\"></div>"+
  (mode==="signup"?"<input id=\"nm\" placeholder=\"Your name\" autocomplete=\"name\">":"")+
  "<input id=\"em\" type=\"email\" placeholder=\"Email\" autocomplete=\"email\"><input id=\"pw\" type=\"password\" placeholder=\"Password (6+ characters)\" autocomplete=\"current-password\"><div class=\"err\">"+err+"</div>"+
  "<button onclick=\"auth()\">"+(mode==="signup"?"Create account":"Log in")+"</button>"+
  "<button class=\"ghost\" onclick=\"setMode('"+(mode==="signup"?"login":"signup")+"')\">"+(mode==="signup"?"I already have an account":"Create a new account")+"</button>";
 }else if(v==="pick"){
  h="<h2>Hi, "+u.name+".</h2><p class=\"mut\">Choose 3 to 5 subjects. Your daily lesson rotates through them.</p><div class=\"chips\">"+
  SUBJ.map(function(s){return"<button class=\"chip"+(sel.indexOf(s)>-1?" on":"")+"\" onclick=\"tog('"+s+"')\">"+s+"</button>"}).join("")+"</div>"+
  "<div class=\"err\">"+err+"</div><p class=\"mut\">"+sel.length+" of 5 selected</p><button "+(sel.length<3?"disabled ":"")+"onclick=\"savePick()\">Continue</button>";
 }else if(v==="home"){
  var t=fmt(new Date()),at=u.att[t];
  if(at){
   h="<div class=\"center\"><span class=\"tag\">Today’s "+at.s+" lesson</span><h2>"+(at.score===3?"Perfect.":at.score>0?"Nice work.":"Come back stronger.")+"</h2><div class=\"sq\">"+at.res.map(function(r){return"<b class=\""+(r?"ok":"")+"\"></b>"}).join("")+"</div><p class=\"mut\">"+at.score+" / 3 today</p></div>"+
   "<div class=\"stats\"><div><strong>"+total(u)+"</strong><small>TOTAL SCORE</small></div><div><strong>"+streak(u)+"</strong><small>DAY STREAK</small></div></div>"+
   "<div class=\"card center\"><span class=\"mut\">Next knowledge in</span><div class=\"cd\" id=\"cd\">"+cd()+"</div></div>";
  }else{
   var l=lesson();
   h="<span class=\"tag\">Today’s lesson · "+l.s+"</span><h2>"+l.t+"</h2><p class=\"mut\">About 3 minutes to read, then a 3-question quiz.</p><div class=\"card\"><p style=\"margin:0\">Total score: <b>"+total(u)+"</b> · Streak: <b>"+streak(u)+"</b></p></div><button onclick=\"start()\">Open today’s lesson</button>";
  }
 }else if(v==="read"){
  var l2=lesson();
  h="<span class=\"tag\">"+l2.s+"</span><h2>"+l2.t+"</h2><div style=\"height:10px\"></div>"+l2.b.map(function(x){return"<p>"+x+"</p>"}).join("")+"<button onclick=\"go('quiz')\">I’m ready: start the quiz</button>";
 }else if(v==="quiz"){
  var l3=lesson(),Q=l3.q[q.i],pct=(q.i+(q.sel!==null?1:0))/3*100;
  h="<div class=\"bar\"><i style=\"width:"+pct+"%\"></i></div><span class=\"tag\">Question "+(q.i+1)+" of 3</span><h2 style=\"font-size:1.4rem\">"+Q[0]+"</h2>"+
  Q[1].map(function(o,j){var c="opt";if(q.sel!==null){if(j===Q[2])c+=" ok";else if(j===q.sel)c+=" bad"}return"<button class=\""+c+"\" onclick=\"pickOpt("+j+")\">"+o+"</button>"}).join("")+
  (q.sel!==null?"<div class=\"card\"><p style=\"margin:0\">"+Q[3]+"</p></div><button onclick=\"next()\">"+(q.i<2?"Next question":"See my score")+"</button>":"");
 }
 a.innerHTML=h;
}
setInterval(function(){var e=document.getElementById("cd");if(e)e.textContent=cd()},1000);
load();
if(mem.session&&mem.users[mem.session]){var u0=U();sel=u0.subjects.slice();v=u0.subjects.length?"home":"pick"}else{mem.session=null;v="auth"}
render();
</script>
</body>
</html>
